<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Content Generator</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 20px;
  }
  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
  }
  select, input, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
  }
  #result {
    margin-top: 30px;
    padding: 15px;
    background: #f4f4f4;
    white-space: pre-wrap;
  }
  #history {
  max-height: 400px;
  overflow-y: auto;
  margin-top: 15px;
}
</style>
</head>
<body>

<h1>AI Content Generator</h1>

<label for="content_type">Content Type</label>
<select id="content_type">
  <option value="blog">Blog Post</option>
  <option value="caption">Social Media Caption</option>
  <option value="ad_copy">Ad Copy</option>
</select>

<label for="topic">Topic</label>
<input type="text" id="topic" placeholder="e.g. benefits of remote work">

<label for="tone">Tone</label>
<input type="text" id="tone" placeholder="e.g. professional, funny, friendly" value="professional">

<label for="length">Length (words)</label>
<input type="number" id="length" placeholder="leave blank for default">

<button id="generateBtn" onclick="generateContent()">Generate</button>

<div id="result"></div>
<hr style="margin-top: 40px;">

<h2>Recent Generations</h2>
<button onclick="loadHistory()">Refresh History</button>
<div id="history"></div>

<script>
async function generateContent() {
  const resultDiv = document.getElementById("result");
  const btn = document.getElementById("generateBtn");

  btn.disabled = true;
  btn.textContent = "Generating...";
  resultDiv.textContent = "";

  const topic = document.getElementById("topic").value.trim();

  if (!topic) {
    resultDiv.textContent = "Please enter a topic before generating.";
    btn.disabled = false;
    btn.textContent = "Generate";
    return;
  }

  const body = {
    content_type: document.getElementById("content_type").value,
    topic: topic,
    tone: document.getElementById("tone").value || "professional",
  };

  const lengthVal = document.getElementById("length").value;
  if (lengthVal) {
    body.length = parseInt(lengthVal);
  }

  try {
    const response = await fetch("http://127.0.0.1:8000/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (!response.ok) {
      const err = await response.json();
      resultDiv.textContent = "Error: " + (err.detail || response.statusText);
      return;
    }

    const data = await response.json();
    resultDiv.textContent = data.generated_text;
    loadHistory();
 } catch (e) {
    resultDiv.textContent = "Request failed: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Generate";
  }
}


async function loadHistory() {
  const historyDiv = document.getElementById("history");
  historyDiv.textContent = "Loading history...";

  try {
    const response = await fetch("http://127.0.0.1:8000/history?limit=10");
    const data = await response.json();

    if (data.length === 0) {
      historyDiv.textContent = "No generations yet.";
      return;
    }

    historyDiv.innerHTML = "";

    data.forEach((item, index) => {
      const card = document.createElement("div");
      card.style.border = "1px solid #ddd";
      card.style.padding = "12px";
      card.style.marginTop = "10px";
      card.style.background = "#fafafa";

      const title = document.createElement("strong");
      title.textContent = `[${item.content_type}] ${item.topic}`;

      const meta = document.createElement("div");
      meta.style.fontSize = "12px";
      meta.style.color = "#777";
      meta.textContent = `Tone: ${item.tone} | Length: ${item.length} | ${new Date(item.created_at).toLocaleString()}`;

      const preview = document.createElement("p");
      preview.style.whiteSpace = "pre-wrap";
      const shortText = item.generated_text.slice(0, 120) + (item.generated_text.length > 120 ? "..." : "");
      preview.textContent = shortText;

      const toggleBtn = document.createElement("button");
      toggleBtn.textContent = "Show more";
      toggleBtn.style.fontSize = "12px";
      toggleBtn.style.padding = "4px 8px";
      toggleBtn.style.marginTop = "5px";

      let expanded = false;
      toggleBtn.onclick = () => {
        expanded = !expanded;
        preview.textContent = expanded ? item.generated_text : shortText;
        toggleBtn.textContent = expanded ? "Show less" : "Show more";
      };

      card.appendChild(title);
      card.appendChild(meta);
      card.appendChild(preview);
      if (item.generated_text.length > 120) {
        card.appendChild(toggleBtn);
      }
      historyDiv.appendChild(card);
    });

  } catch (e) {
    historyDiv.textContent = "Failed to load history: " + e.message;
  }
}


window.onload = loadHistory;
</script>

</body>
</html>
